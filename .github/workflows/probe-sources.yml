# One-off, read-only: prints what the free data sources the learning features use actually return
# (long price histories, the VIX, article feeds), so the code parses the real shapes. Run it from Actions → Probe data sources → Run workflow.
name: Probe data sources
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install curl_cffi
      - run: python scripts/probe_sources.py
