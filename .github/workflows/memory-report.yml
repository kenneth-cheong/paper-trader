name: Market memory report

# Run by hand (Actions → Market memory report → Run workflow). Prints how each market's stocks moved
# after past news and after big one-day moves, big moves against the index with and without news, the
# ten-year studies with their held-out check and regime table, the lessons the AI funds get from them,
# and the news digests' quality week by week (with the news feeds' leads on or off). Read-only: no AI
# calls, nothing private.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ai-state
          path: state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: curl -sf "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/prices.json" -o prices.json
      - run: node scripts/memory-report.mjs state/news-events.json prices.json state/results-dates.json state/company-data.json state/memory-long.json state/news-quality.json state/move-news.json
