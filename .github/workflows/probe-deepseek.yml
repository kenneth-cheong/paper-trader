name: Probe DeepSeek (one-off)

# Run by hand. Makes one real fund decision with each DeepSeek model through the app's own code (ai.js
# decideFund), on the sample prices and a new test fund, printing only counts, the cost and any error
# (no key, no fund data). Removed once the DeepSeek option is confirmed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cat > probe.mjs <<'JS'
          import { readFileSync } from 'node:fs';
          import { decideFund } from './ai.js';
          import { newFund } from './fund.js';
          const prices = JSON.parse(readFileSync('data/sample-prices.json', 'utf8'));
          const now = new Date();
          for (const model of ['deepseek-flash', 'deepseek-v4-pro']) for (const currency of ['USD', 'SGD']) {
            const fund = newFund({ budget: 10000, currency, now });
            fund.settings.model = model;
            const news = { market_summary: 'A quiet day with no company news.', items: [], model: 'none', usage: { costUsd: 0 }, createdAt: now.toISOString() };
            const t = Date.now();
            try {
              const d = await decideFund({ fund, quotes: prices.quotes, news, model, deepseek: { apiKey: process.env.DEEPSEEK_API_KEY }, now });
              console.log(JSON.stringify({ model, currency, seconds: Math.round((Date.now() - t) / 1000), orders: (d.orders ?? []).map((o) => `${o.action} ${o.shares} ${o.symbol}`), considered: d.considered?.length, protections: d.protections?.length, outlookChars: d.outlook?.length, usage: d.usage }));
            } catch (err) {
              console.log(JSON.stringify({ model, currency, seconds: Math.round((Date.now() - t) / 1000), error: err.message, usage: err.usage }));
            }
          }
          JS
          node probe.mjs
