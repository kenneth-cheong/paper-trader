name: Update prices, AI picks and AI fund

on:
  push:
    branches: [main]
  schedule:
    # Every 15 minutes on weekdays while SGX (01:00-09:00 UTC) or US markets (13:30-21:00 UTC) trade,
    # plus one run after the US close so the day's closing prices land. GitHub may start scheduled runs late.
    - cron: '*/15 1-9,13-21 * * 1-5'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      refresh_picks:
        description: Get fresh AI long/short picks now
        type: boolean
        default: false
      fund_start_amount:
        description: Start a NEW AI fund with this amount, alongside any running ones (up to 5). Leave empty otherwise.
        type: string
        default: ''
      fund_currency:
        description: New fund's currency (USD trades US stocks, SGD trades SGX stocks)
        type: choice
        options: [USD, SGD]
        default: USD
      fund_decisions_per_day:
        description: How many times a trading day the AI decides (each costs roughly US$0.05-0.15 on the default model)
        type: choice
        options: ['1', '2', '4']
        default: '1'
      fund_stop:
        description: Stop the AI fund and close its positions (only when one fund is running; with several, use the app)
        type: boolean
        default: false
      backfill_news:
        description: 'Learning: look up the past year of news for every stock (one-off, about US$1-2) for the AI funds'' market memory'
        type: boolean
        default: false
      fund_command:
        description: 'Advanced, sent by the app: JSON such as {"pause":true} or {"approve":["id"]}'
        type: string
        default: ''

permissions:
  contents: write # saves AI picks and AI fund state to the ai-state branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL }}           # decisions; default claude-sonnet-5
      AI_NEWS_MODEL: ${{ vars.AI_NEWS_MODEL }} # news gathering; default claude-haiku-4-5
      AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }} # opt-in: the weekly review, once its market has 150 graded ideas (README)
      AI_MONTHLY_CAP_USD: ${{ vars.AI_MONTHLY_CAP_USD || '30' }} # scheduled AI stops for the month at this spend; 0 = no cap
      NEWS_LEADS: ${{ vars.NEWS_LEADS }} # 'off' stops giving the news digest the feeds' headlines as leads (README → News feeds)
      # Tiger Brokers, for an AI fund that trades through Tiger (see README → Tiger Brokers)
      TIGEROPEN_TIGER_ID: ${{ secrets.TIGEROPEN_TIGER_ID }}
      TIGEROPEN_ACCOUNT: ${{ secrets.TIGEROPEN_ACCOUNT }}
      TIGEROPEN_PRIVATE_KEY: ${{ secrets.TIGEROPEN_PRIVATE_KEY }}
      TIGEROPEN_LICENSE: ${{ secrets.TIGEROPEN_LICENSE }}
      TIGER_LIVE_TRADING: ${{ vars.TIGER_LIVE_TRADING }} # must be "yes" before a live (real-money) account can trade
      FUND_STATE_TOKEN: ${{ secrets.FUND_STATE_TOKEN }} # keeps the AI fund private in Supabase (supabase/private-fund.sql)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} # Telegram alerts (README → Telegram alerts)
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund @anthropic-ai/sdk@0.128.0
      - run: node --test
      - id: pages
        uses: actions/configure-pages@v5
      # Passing the live prices.json lets a symbol that fails this run keep its last price.
      # If every price fails, the site still deploys (it falls back to sample prices with a banner).
      # Each stock's daily prices come for 2 years: prices.json keeps the last year, and data/ohlcv.json
      # (the two years, for the AI fund step's factor lab) stays on this runner: .gitignore'd, and
      # "Collect site files" below never copies it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: python -m unittest discover -s test -p 'test_*.py'
      - name: Download prices from Yahoo
        continue-on-error: true
        run: |
          pip install --quiet curl_cffi
          python scripts/yahoo_fetch.py raw
      - name: Build prices.json
        id: prices
        continue-on-error: true
        env:
          YAHOO_RAW_DIR: raw
        run: node scripts/fetch-prices.mjs "${{ steps.pages.outputs.base_url }}/data/prices.json"

      # AI picks and the AI fund keep their state on a separate branch, so main's history stays clean.
      - name: Load AI state
        env:
          TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin ai-state >/dev/null; then
            git clone --quiet --depth 1 --branch ai-state "$url" state
          else
            git init --quiet -b ai-state state
            git -C state remote add origin "$url"
          fi
      # The results calendar and analysts' views (calendar.js, analysts.js). Both are optional: when a
      # source fails, the last copy on ai-state is used, and without any the dates are simply unknown.
      - name: 'Results dates from SEC filings'
        continue-on-error: true
        env:
          # "Your Name you@example.com" (README → Results calendar and analysts). Set only for this step,
          # and a secret of the same name works too, if you'd rather the address stayed out of the log.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: node scripts/fetch-filings.mjs state/results-dates.json
      - name: 'Company data from Yahoo (once a day)'
        continue-on-error: true
        run: |
          if node scripts/company-data.mjs due state/company-data.json; then
            pip install --quiet curl_cffi
            python scripts/yahoo_fetch.py summary raw-summary
            node scripts/company-data.mjs build raw-summary state/company-data.json
          fi
      # Ten years of the watchlist's own prices for the market memory (memory-long.js), once a week:
      # when state/memory-long.json is 7 or more days old, or missing. The raw download (about 6 MB) stays
      # on this runner; only the compact results (under 50 KB) go to ai-state. If Yahoo fails, last
      # week's results are kept and it tries again 6 hours later.
      - name: 'Learning: ten years of prices (weekly)'
        continue-on-error: true
        run: |
          if node scripts/build-history.mjs due state/memory-long.json; then
            pip install --quiet curl_cffi
            python scripts/yahoo_fetch.py long raw-long
            node scripts/build-history.mjs build raw-long state/memory-long.json
          fi
      # The stock cards' public part (dossier.js, state/dossiers.json): each stock's own history and risk
      # from this run's prices, the ten-year memory, the results calendar and the picks' record. Rebuilt
      # with the weekly step above, and refreshed here once a day; the page reads it. Prices and news
      # only: each fund's own record on a stock stays with the fund.
      - name: 'Stock cards (daily)'
        continue-on-error: true
        run: node scripts/build-history.mjs dossiers state/dossiers.json
      # News feeds (feeds.json, articles.js), at most every 6 hours: each feed is downloaded to this runner
      # (scripts/feed_fetch.py, never saved), and only the headlines naming a watchlist stock are kept, with
      # their links (state/articles/YYYY-MM.json), as leads for the news digest. A feed that keeps failing
      # is tried once a day until it answers. Then each big move against the index is judged on whether it
      # had news, and those without get one web search each (at most 10 a month, in the spend ledger).
      # Once a day, the reading guide reads up to 40 new headlines, investing sites first, with the start
      # of each summary from these downloads (never stored), and keeps each site's calls
      # (state/reading-calls.json, reading.js) for the page. One cheap call, in the spend ledger as
      # 'reading'; nothing from it reaches the AI funds or the picks.
      - name: 'Articles: news feeds (every 6 hours)'
        continue-on-error: true
        run: |
          if node scripts/fetch-articles.mjs due state raw-feeds; then
            pip install --quiet curl_cffi
            python scripts/feed_fetch.py raw-feeds
            node scripts/fetch-articles.mjs build raw-feeds state
            node scripts/fetch-articles.mjs moves state || echo "::warning::Big moves: the step failed (see above); the reading guide still runs."
            node scripts/fetch-articles.mjs calls raw-feeds state
          fi
      # A failure in an AI step must not stop prices from updating.
      - name: AI picks
        continue-on-error: true
        env:
          FORCE_PICKS: ${{ inputs.refresh_picks }}
        run: node scripts/fetch-picks.mjs state/picks.json
      - name: 'Learning: backfill past news (one-off)'
        if: inputs.backfill_news
        continue-on-error: true
        run: node scripts/backfill-news.mjs state/news-events.json
      # With FUND_STATE_TOKEN the fund lives privately in Supabase; if it can't be read, the fund's steps
      # are skipped (running from an old copy could forget orders sent to Tiger).
      - name: Load the AI fund
        id: fundstore
        run: node scripts/fund-store.mjs load state/ai-fund.json
      - name: 'Tiger: check orders and positions'
        if: steps.fundstore.outputs.ok == 'true'
        continue-on-error: true
        run: |
          if [ -n "$TIGEROPEN_TIGER_ID" ]; then pip install --quiet tigeropen; fi
          python scripts/tiger_broker.py sync state/ai-fund.json
      # An article the owner logged in the app (reading.js): when the app's command has a link, its page is
      # downloaded to this runner (never saved) for the AI fund step to read. The script reads the command
      # from the event file, like the next step, and prints only whether the download worked.
      - name: 'Your reading: fetch a logged article'
        if: steps.fundstore.outputs.ok == 'true' && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          pip install --quiet curl_cffi
          python scripts/page_fetch.py raw-page
      # The app's command (the fund_command input) is read by the script from the event file on the
      # runner: an env value would be printed in this public log, and it can hold the owner's notes on
      # stocks, reasons for declining trades and the articles they log.
      - name: AI fund
        if: steps.fundstore.outputs.ok == 'true'
        continue-on-error: true
        env:
          FUND_PRIVATE: ${{ steps.fundstore.outputs.private }}
          FUND_START_AMOUNT: ${{ inputs.fund_start_amount }}
          FUND_CURRENCY: ${{ inputs.fund_currency }}
          FUND_DECISIONS_PER_DAY: ${{ inputs.fund_decisions_per_day }}
          FUND_STOP: ${{ inputs.fund_stop }}
        run: node scripts/ai-fund.mjs state/ai-fund.json state/picks.json
      - name: 'Tiger: send orders'
        if: steps.fundstore.outputs.ok == 'true'
        continue-on-error: true
        run: python scripts/tiger_broker.py send state/ai-fund.json
      - name: Telegram alerts
        if: steps.fundstore.outputs.ok == 'true'
        continue-on-error: true
        run: APP_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" node scripts/notify.mjs state/ai-fund.json
      # Ask the data (hypotheses.js): the owner's questions wait in the fund collection, loaded above, so
      # they're answered here rather than in the weekly step. The answer comes from the ten years of raw
      # prices: this run's weekly download when there was one, else a new download (at most once every
      # 20 hours while a question waits). Questions on the funds' own ideas are answered in the AI fund
      # step. The script reads the collection from the file, and prints counts only.
      - name: 'Ask the data: answer the owner''s questions'
        if: steps.fundstore.outputs.ok == 'true'
        continue-on-error: true
        run: |
          if node scripts/build-history.mjs asked state/ai-fund.json raw-long; then
            if [ ! -f raw-long/SPY_10y_1d.json ]; then
              pip install --quiet curl_cffi
              python scripts/yahoo_fetch.py long raw-long
            fi
            node scripts/build-history.mjs answer raw-long state/ai-fund.json
          fi
      - name: Store the AI fund
        id: fundsave
        if: steps.fundstore.outputs.ok == 'true'
        run: node scripts/fund-store.mjs save state/ai-fund.json
      - name: Save AI state
        run: |
          cd state
          git add -A
          as_bot() { git -c user.name="paper-trader bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" "$@"; }
          if [ "${{ steps.fundsave.outputs.saved }}" = "true" ] && git cat-file -e HEAD:ai-fund.json 2>/dev/null; then
            # The fund just moved to Supabase: restart this public branch so its history no longer holds it.
            git checkout --quiet --orphan fresh
            git add -A
            as_bot commit --quiet -m "AI state (the AI fund is now kept privately)"
            git push --quiet --force origin fresh:ai-state
          elif ! git diff --cached --quiet; then
            as_bot commit --quiet -m "AI state $(date -u +%FT%TZ)"
            git push --quiet origin ai-state
          fi

      - name: Collect site files
        run: |
          mkdir -p _site/data
          cp index.html *.js styles.css _site/
          cp data/sample-prices.json _site/data/
          cp data/prices.json _site/data/ 2>/dev/null || echo "::warning::No prices this run; the site shows sample prices."
          cp state/picks.json _site/data/ 2>/dev/null || true
          cp state/picks-history.json _site/data/ 2>/dev/null || true
          cp state/company-data.json _site/data/ 2>/dev/null || true   # results dates and analysts, for the page
          cp state/results-dates.json _site/data/ 2>/dev/null || true
          cp state/memory-long.json _site/data/ 2>/dev/null || true   # the ten-year memory, for the page
          cp state/dossiers.json _site/data/ 2>/dev/null || true      # the stock cards, for the page
          cp state/reading-calls.json _site/data/ 2>/dev/null || true # the reading guide's calls, for the page
          node -e "const fs=require('fs');let l={months:{}};try{l=JSON.parse(fs.readFileSync('state/ai-spend.json','utf8'))}catch{}l.cap=Number(process.env.AI_MONTHLY_CAP_USD)||null;fs.writeFileSync('_site/data/ai-spend.json',JSON.stringify(l))"
          # The public copy of the AI fund, unless it's kept private (then only admins see it, from Supabase)
          if [ "${{ steps.fundstore.outputs.private }}" != "true" ]; then
            node scripts/public-fund.mjs state/ai-fund.json _site/data/ai-fund.json
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
